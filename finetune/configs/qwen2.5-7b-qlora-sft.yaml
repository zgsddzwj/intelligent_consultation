# Qwen2.5-7B-Instruct QLoRA SFT —— 智能问诊项目混合多任务
# 运行方式（在 finetune/ 目录下）：
#   llamafactory-cli train configs/qwen2.5-7b-qlora-sft.yaml
# 低显存备选：把 model_name_or_path 换成 Qwen/Qwen2.5-3B-Instruct 或 1.5B

### 模型
model_name_or_path: Qwen/Qwen2.5-7B-Instruct
trust_remote_code: true
# 国内网络建议开启 ModelScope 下载（约 15GB）：
use_modelscope: true

### 方法
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
# QLoRA 4bit（bitsandbytes）；Windows 下若 bnb 异常，注释掉 quantization_bit 改纯 bf16 LoRA（24GB 足够）
quantization_bit: 4
# LlamaFactory v0.9.5+ 的枚举值；不要使用旧版的 bitsandbytes。
quantization_method: bnb
quantization_type: nf4
double_quantization: true

### 数据
dataset: medical_sft_mix
dataset_dir: configs
template: qwen
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 8
dataloader_num_workers: 4
# 训练集 2% 作为验证集
val_size: 0.02

### 输出
output_dir: saves/qwen2.5-7b-qlora-sft
logging_steps: 10
save_steps: 100
save_total_limit: 3
plot_loss: true
# 保留 checkpoint，避免中断重跑时静默覆盖训练产物。
overwrite_output_dir: false

### 训练超参
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true
seed: 42
data_seed: 42

### 训练中评估
per_device_eval_batch_size: 2
eval_strategy: steps
eval_steps: 100
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
