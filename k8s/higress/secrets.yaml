# Higress Secret 模板
# 请勿将真实密钥提交到版本库
#
# 生产环境请使用 kubectl 创建 Secret：
#
#   kubectl create secret generic higress-ai-secrets \
#     --namespace=higress-system \
#     --from-literal=SILICONFLOW_API_KEY='<你的硅基流动API密钥>' \
#     --from-literal=OPENAI_API_KEY='<可选：OpenAI密钥>' \
#     --from-literal=DEEPSEEK_API_KEY='<可选：DeepSeek密钥>' \
#     --from-literal=HIGRESS_ADMIN_TOKEN='<Higress管理令牌>'
#
apiVersion: v1
kind: Secret
metadata:
  name: higress-ai-secrets
  namespace: higress-system
  labels:
    app.kubernetes.io/name: higress
    app.kubernetes.io/part-of: intelligent-consultation
type: Opaque
stringData:
  SILICONFLOW_API_KEY: "REPLACE_ME"
  OPENAI_API_KEY: ""
  DEEPSEEK_API_KEY: ""
  HIGRESS_ADMIN_TOKEN: "REPLACE_ME"
